# Netlify hosts the React frontend. The FastAPI backend runs on Render
# (see render.yaml); Netlify proxies /api/* to it so the browser sees one
# origin and the login cookie works, the same as Vite's dev proxy.

[build]
  command = "npm run build"
  publish = "dist"

# The backend's address on Render (Render → astra-api, under the service name).
[[redirects]]
  from = "/api/*"
  to = "https://astra-api-xllg.onrender.com/api/:splat"
  status = 200
  force = true
